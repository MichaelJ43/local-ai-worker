[package]
name = "ai_worker_core"
# Explicit versions so `cargo build --manifest-path crates/ai_worker_core/Cargo.toml` works in Docker.
version = "0.1.9"
edition = "2021"
license = "MIT"
description = "Core logic for local AI worker manager"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
sysinfo = "0.32"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5.0"

[[bin]]
name = "worker-guard"
path = "src/bin/worker-guard.rs"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
