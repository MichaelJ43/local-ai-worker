name: Docs site deploy

on:
  push:
    branches: [main, master]
    paths:
      - "docs-site/**"
      - "docs/images/**"
      - ".github/workflows/docs-site-deploy.yml"
      - ".github/workflows/publish-docs-site-image.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: commit SHA)"
        required: false
        type: string
        default: ""

concurrency:
  group: docs-site-deploy-${{ github.ref }}
  cancel-in-progress: true

# Optional: uncomment to attach GitHub Deployments + environment URL after creating
# `aiworkers-docs` (or your name) in repo Settings → Environments.
permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/publish-docs-site-image.yml
    secrets: inherit
    with:
      checkout_ref: ${{ github.sha }}
      # workflow_dispatch: use input when set; push: always use commit SHA
      image_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || github.sha }}

  terraform-fargate:
    needs: image
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Image URI
        id: img
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || github.sha }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "uri=ghcr.io/${owner}/local-ai-worker-docs:${TAG}" >> "${GITHUB_OUTPUT}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform init
        working-directory: infra/terraform/docs-site-fargate
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=docs-site/fargate/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform apply
        working-directory: infra/terraform/docs-site-fargate
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.TF_CUSTOM_DOMAIN }}
          TF_VAR_hosted_zone_id: ${{ secrets.TF_ROUTE53_HOSTED_ZONE_ID }}
          TF_VAR_certificate_arn: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
          TF_VAR_container_image: ${{ steps.img.outputs.uri }}
          TF_VAR_github_repository: ${{ github.repository }}
        run: terraform apply -auto-approve

      - name: Write deploy marker to SSM
        shell: bash
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ssm put-parameter --name /local-ai-worker/docs/site_mode --value fargate --type String --overwrite
          aws ssm put-parameter --name /local-ai-worker/docs/last_fargate_deploy_iso --value "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --type String --overwrite
