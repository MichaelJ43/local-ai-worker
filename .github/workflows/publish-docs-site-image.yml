name: Publish docs site image

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: local-ai-worker-docs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Lowercase owner for GHCR
        id: own
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs-site/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.own.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ghcr.io/${{ steps.own.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
