# Build and push the worker agent image to GitHub Container Registry.
# Semver tags match Cargo on main (push/dispatch). Release builds use release.yml, which
# calls the same reusable workflow so GHCR always gets the tag before installers ship.

name: Worker agent image

on:
  push:
    branches: [main, master]
    paths:
      - "docker/**"
      - "crates/ai_worker_core/**"
      - "docs/rules/rules-tree.json"
      - ".github/workflows/worker-agent-image.yml"
      - ".github/workflows/publish-worker-agent-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.meta.outputs.image_version }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Resolve image tag and ref
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(
            awk '
              /^\[workspace\.package\]/ { inws=1; next }
              inws && /^version = / {
                gsub(/^version = "|".*$/, "", $0)
                print
                exit
              }
            ' Cargo.toml
          )"
          if [ -z "${VERSION}" ]; then
            echo "Could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          echo "image_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Publishing from ${GITHUB_SHA}, semver ${VERSION}"

  publish:
    needs: resolve
    uses: ./.github/workflows/publish-worker-agent-image.yml
    secrets: inherit
    with:
      checkout_ref: ${{ needs.resolve.outputs.checkout_ref }}
      image_version: ${{ needs.resolve.outputs.image_version }}
