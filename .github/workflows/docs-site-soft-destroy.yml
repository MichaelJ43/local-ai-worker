name: Docs site soft destroy

# Parks the site on S3 + CloudFront and tears down the Fargate stack. Requires
# static export output (see docs-site/README.md) and Route53 cutover steps.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  soft-destroy:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and export static HTML
        run: |
          dotnet build docs-site/LocalAiWorker.Docs.sln -c Release
          dotnet run --project docs-site/LocalAiWorker.Docs -c Release --urls http://127.0.0.1:5055 --no-build &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:5055/health && break || sleep 1; done
          chmod +x docs-site/scripts/static-export.sh
          DOCS_URL=http://127.0.0.1:5055 OUT_DIR="${GITHUB_WORKSPACE}/docs-site/static-out" docs-site/scripts/static-export.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform init (static)
        working-directory: infra/terraform/docs-site-static
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=docs-site/static/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Resolve CloudFront ACM certificate ARN
        id: cloudfront_cert
        shell: bash
        env:
          TF_CLOUDFRONT_ACM_CERTIFICATE_ARN: ${{ secrets.TF_CLOUDFRONT_ACM_CERTIFICATE_ARN }}
          TF_ACM_CERTIFICATE_ARN: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          ARN="${TF_CLOUDFRONT_ACM_CERTIFICATE_ARN:-}"
          if [[ -z "$ARN" ]]; then
            ARN="${TF_ACM_CERTIFICATE_ARN:-}"
          fi
          if [[ -z "$ARN" ]]; then
            echo "::error::Missing ACM certificate: set TF_ACM_CERTIFICATE_ARN (when AWS_REGION is us-east-1) or TF_CLOUDFRONT_ACM_CERTIFICATE_ARN (us-east-1 ACM for CloudFront)."
            exit 1
          fi
          echo "arn=${ARN}" >> "${GITHUB_OUTPUT}"

      - name: Import Route53 apex into static state (if already in AWS)
        continue-on-error: true
        working-directory: infra/terraform/docs-site-static
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.TF_CUSTOM_DOMAIN }}
          TF_VAR_hosted_zone_id: ${{ secrets.TF_ROUTE53_HOSTED_ZONE_ID }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_cloudfront_certificate_arn: ${{ steps.cloudfront_cert.outputs.arn }}
        run: |
          if ! terraform state show aws_route53_record.apex >/dev/null 2>&1; then
            terraform import aws_route53_record.apex \
              "${{ secrets.TF_ROUTE53_HOSTED_ZONE_ID }}_${{ vars.TF_CUSTOM_DOMAIN }}_A"
          fi

      - name: Terraform apply (static)
        working-directory: infra/terraform/docs-site-static
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.TF_CUSTOM_DOMAIN }}
          TF_VAR_hosted_zone_id: ${{ secrets.TF_ROUTE53_HOSTED_ZONE_ID }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_cloudfront_certificate_arn: ${{ steps.cloudfront_cert.outputs.arn }}
        run: terraform apply -auto-approve

      - name: Sync to S3
        id: bucket
        working-directory: infra/terraform/docs-site-static
        run: |
          BID=$(terraform output -raw s3_bucket_id)
          echo "bucket=${BID}" >> "${GITHUB_OUTPUT}"
          aws s3 sync "${GITHUB_WORKSPACE}/docs-site/static-out" "s3://${BID}/" --delete

      - name: Invalidate CloudFront
        working-directory: infra/terraform/docs-site-static
        run: |
          CID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "${CID}" --paths "/*"

      - name: Terraform init (fargate)
        working-directory: infra/terraform/docs-site-fargate
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=docs-site/fargate/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform destroy (fargate)
        working-directory: infra/terraform/docs-site-fargate
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.TF_CUSTOM_DOMAIN }}
          TF_VAR_hosted_zone_id: ${{ secrets.TF_ROUTE53_HOSTED_ZONE_ID }}
          TF_VAR_certificate_arn: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
          TF_VAR_container_image: ghcr.io/example/example:latest
          TF_VAR_github_repository: ${{ github.repository }}
        run: |
          set -euo pipefail
          if terraform state show aws_route53_record.apex >/dev/null 2>&1; then
            terraform state rm aws_route53_record.apex
            echo "Removed aws_route53_record.apex from fargate state (apex DNS kept; managed by static stack)."
          fi
          terraform destroy -auto-approve

      - name: Mark SSM static
        run: |
          aws ssm put-parameter --name /local-ai-worker/docs/site_mode --value static --type String --overwrite
