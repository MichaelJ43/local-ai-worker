name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
      workflow: ${{ steps.filter.outputs.workflow }}
      docker_ctx: ${{ steps.filter.outputs.docker_ctx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            js:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
              - 'playwright.config.js'
              - 'test/playwright/**'
            rust:
              - 'crates/**'
              - 'cursor-agent-bridge/**'
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'test/**'
              - 'docker/**'
            workflow:
              - '.github/workflows/**'
            docker_ctx:
              - 'docker/**'
              - 'crates/ai_worker_core/**'
              - 'docs/rules/rules-tree.json'
              - '.github/workflows/publish-worker-agent-image.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.js == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.js == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies (Tauri link)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf curl wget file
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --prefix cursor-agent-bridge
      - uses: dtolnay/rust-toolchain@stable
        with:
          workspaces: src-tauri
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - name: Repo agent JSON fixtures (bash + jq)
        if: matrix.os == 'ubuntu-latest'
        run: bash test/scripts/repo_agent_fixture_test.sh

  docker-worker-agent:
    needs: changes
    if: needs.changes.outputs.docker_ctx == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker agent image
        run: docker build -f docker/Dockerfile.worker .

  ci-success:
    name: CI success
    needs: [changes, frontend, rust, e2e, docker-worker-agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          E2E: ${{ needs.e2e.result }}
          DOCKER_AGENT: ${{ needs.docker-worker-agent.result }}
        run: |
          echo "changes=$CHANGES frontend=$FRONTEND rust=$RUST e2e=$E2E dockerAgent=$DOCKER_AGENT"
          if [ "$CHANGES" != "success" ]; then
            echo "changes job did not succeed."
            exit 1
          fi
          for r in "$FRONTEND" "$RUST" "$E2E" "$DOCKER_AGENT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A CI job failed or was cancelled."
              exit 1
            fi
          done
