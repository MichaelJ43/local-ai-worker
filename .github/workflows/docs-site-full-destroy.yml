name: Docs site full destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to destroy static + fargate Terraform stacks"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: github.event.inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Resolve CloudFront ACM certificate ARN
        id: cloudfront_cert
        shell: bash
        env:
          TF_CLOUDFRONT_ACM_CERTIFICATE_ARN: ${{ secrets.TF_CLOUDFRONT_ACM_CERTIFICATE_ARN }}
          TF_ACM_CERTIFICATE_ARN: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          ARN="${TF_CLOUDFRONT_ACM_CERTIFICATE_ARN:-}"
          if [[ -z "$ARN" ]]; then
            ARN="${TF_ACM_CERTIFICATE_ARN:-}"
          fi
          if [[ -z "$ARN" ]]; then
            echo "::error::Missing ACM certificate: set TF_ACM_CERTIFICATE_ARN (when AWS_REGION is us-east-1) or TF_CLOUDFRONT_ACM_CERTIFICATE_ARN (us-east-1 ACM for CloudFront)."
            exit 1
          fi
          echo "arn=${ARN}" >> "${GITHUB_OUTPUT}"

      - name: Terraform destroy (static)
        continue-on-error: true
        working-directory: infra/terraform/docs-site-static
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.TF_CUSTOM_DOMAIN }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_cloudfront_certificate_arn: ${{ steps.cloudfront_cert.outputs.arn }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=docs-site/static/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"
          terraform destroy -auto-approve

      - name: Terraform destroy (fargate)
        continue-on-error: true
        working-directory: infra/terraform/docs-site-fargate
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.TF_CUSTOM_DOMAIN }}
          TF_VAR_hosted_zone_id: ${{ secrets.TF_ROUTE53_HOSTED_ZONE_ID }}
          TF_VAR_certificate_arn: ${{ secrets.TF_ACM_CERTIFICATE_ARN }}
          TF_VAR_container_image: ghcr.io/example/example:latest
          TF_VAR_github_repository: ${{ github.repository }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=docs-site/fargate/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"
          terraform destroy -auto-approve

      - name: SSM none
        run: |
          aws ssm put-parameter --name /local-ai-worker/docs/site_mode --value none --type String --overwrite || true
